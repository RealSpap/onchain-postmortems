name: Check README self-consistency

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  check-readme-consistency:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run README self-consistency check
        run: python3 check_readme_consistency.py
