name: Release new incidents

# Runs only after the consistency check has passed on a push to main.
# Creates a release only when new incident folders were added since the
# previous release, and at most one release per day: incidents added later
# the same day are included in the next release.

on:
  workflow_run:
    workflows: ["Check README self-consistency"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

permissions: {}

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the commit that passed the check
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Create a release for new incidents
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          TODAY="$(date -u +%Y-%m-%d)"

          LAST_TAG="$(gh release list --limit 1 --json tagName --jq '.[0].tagName // ""')"
          LAST_DATE="$(gh release list --limit 1 --json createdAt --jq '.[0].createdAt // ""' | cut -c1-10)"
          if [ "$LAST_DATE" = "$TODAY" ]; then
            echo "A release already exists today; later additions go in the next one."
            exit 0
          fi

          if [ -n "$LAST_TAG" ] && git rev-parse -q --verify "refs/tags/$LAST_TAG^{commit}" >/dev/null; then
            BASE="$LAST_TAG"
          else
            BASE="$(git rev-parse HEAD^)"
          fi

          NEW="$(git diff --name-only --diff-filter=A "$BASE" "$HEAD_SHA" \
                 | grep -E '^[^./][^/]*/README\.md$' | cut -d/ -f1 | sort -u || true)"
          if [ -z "$NEW" ]; then
            echo "No new incident folder since $BASE; no release."
            exit 0
          fi

          NOTES="${RUNNER_TEMP}/notes.md"
          : > "$NOTES"
          COUNT=0
          for SLUG in $NEW; do
            TITLE="$(head -n 1 "$SLUG/README.md" | sed -e 's/^#* *//')"
            printf -- '- [%s](https://github.com/%s/tree/main/%s/)\n' "$TITLE" "$GH_REPO" "$SLUG" >> "$NOTES"
            COUNT=$((COUNT + 1))
          done
          printf '\nFull index: https://github.com/%s/blob/main/INDEX.md\n' "$GH_REPO" >> "$NOTES"

          if [ "$COUNT" -eq 1 ]; then
            REL_TITLE="$TITLE"
          else
            REL_TITLE="$COUNT new incidents, $TODAY"
          fi

          gh release create "incidents-$TODAY" \
            --title "$REL_TITLE" \
            --notes-file "$NOTES" \
            --target "$HEAD_SHA"
