name: Auto Release

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Decide whether this push is a research pass
        id: gate
        run: |
          SUBJECT="$(git log -1 --format=%s)"
          echo "Commit subject: $SUBJECT"
          SKIP=false
          # Bot/state-only automation commits (e.g. "chore(monitor): update
          # signer-monitor state") are not a research pass, skip those.
          if printf '%s' "$SUBJECT" | grep -Eqi '^(chore|ci|bot|build)(\([^)]*\))?:.*(monitor|signer|heartbeat|state|status)'; then
            SKIP=true
          fi
          # Merge commits carry no research content of their own.
          if printf '%s' "$SUBJECT" | grep -Eqi '^merge (pull request|branch)'; then
            SKIP=true
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"

      - name: Build release title and body
        if: steps.gate.outputs.skip != 'true'
        id: build
        run: |
          SHORT_SHA="$(git rev-parse --short HEAD)"
          DATE_UTC="$(date -u +%Y-%m-%d)"
          TAG="pass-${DATE_UTC}-${SHORT_SHA}"
          TITLE="$(git log -1 --format=%s)"

          BODY_FILE="${RUNNER_TEMP}/release_body.txt"
          git log -1 --format=%b > "$BODY_FILE"

          # Drop attribution trailers, they aren't reader-facing release
          # content, matching how CHANGELOG.md entries already read.
          sed -i '/^Co-Authored-By:/d' "$BODY_FILE"

          # Trim leading and trailing blank lines left behind.
          sed -i '/./,$!d' "$BODY_FILE"
          sed -i -e :a -e '/^\n*$/{$d;N;};/\n$/ba' "$BODY_FILE"

          # Some commits (small doc tweaks) have no body at all; fall back
          # to the subject line so the release never ships an empty body.
          if ! grep -q '[^[:space:]]' "$BODY_FILE"; then
            printf '%s\n' "$TITLE" > "$BODY_FILE"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "body_file=$BODY_FILE" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REL_TAG: ${{ steps.build.outputs.tag }}
          REL_TITLE: ${{ steps.build.outputs.title }}
          REL_BODY_FILE: ${{ steps.build.outputs.body_file }}
          REL_TARGET: ${{ github.sha }}
        run: |
          if gh release view "$REL_TAG" >/dev/null 2>&1; then
            echo "Release $REL_TAG already exists for this commit, skipping."
            exit 0
          fi
          gh release create "$REL_TAG" \
            --title "$REL_TITLE" \
            --notes-file "$REL_BODY_FILE" \
            --target "$REL_TARGET"
